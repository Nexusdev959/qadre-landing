    <!-- Aplicar tema guardado/del sistema antes del primer render para evitar parpadeos -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('qadre-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      })();
