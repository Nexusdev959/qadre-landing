<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Qadre · Sistema POS, Control de Inventario y Catálogo Digital para Negocios</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Controla tus ventas, inventario, créditos, catálogo web para WhatsApp y marketing en un solo sistema. Diseñado para tiendas y negocios modernos." />
    <meta name="keywords" content="POS, punto de venta, inventario, catalogo digital, colombia, nequi, bancolombia, tickets de venta, facturas whatsapp" />
    <meta property="og:title" content="Qadre · Tu Negocio en Control Total" />
    <meta property="og:description" content="POS moderno, control de caja, créditos con comprobante, catálogo online y creador de pósters de marketing." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qadre.net" />
    <meta name="theme-color" content="#090D16" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="124x124" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <!-- Apply saved / system theme before first paint to avoid a flash -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('qadre-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
